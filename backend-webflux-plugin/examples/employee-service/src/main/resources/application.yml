spring:
  application:
    name: employee-service
  # Sample-only: H2 R2DBC in-memory so this project runs with zero external services.
  # Production usage of the plugin's default profile targets MySQL 8.0.33 via
  # io.asyncer:r2dbc-mysql (see docs/decisions.md Decision 4 and Decision 5); swap the
  # r2dbc.url below to r2dbc:mysql://... to point at a real MySQL instance instead.
  # H2 runs in MySQL mode with lower-cased, case-insensitive identifiers so the REAL
  # migration file boots it unchanged and every query is written in MySQL's unquoted
  # form -- the same SQL the r2dbc:mysql swap will run (a double-quoted identifier is a
  # string literal to MySQL).
  r2dbc:
    url: r2dbc:h2:mem:///employeedb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:migration/V1__create_employee_table.sql
