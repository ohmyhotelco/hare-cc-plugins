schema_version: "1.1"
name: base-local-branch-refused
description: >-
  --base master names a local branch. changed-lines.sh refuses it; the skill must stop and show
  the reason instead of running the review.
plugins: ["../.."]
runs: 1
tags: [attribution]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Bash]
  prompt: "/frontend-v2-plugin:v2-clean-code --base master app/components/card.tsx"
graders:
  - name: refusal-shown
    type: regex
    pattern: 'refusing local branch|local branch'
    flags: i
  - name: no-reviewer-launched
    type: tool_used
    tool: Agent
    min: 0
    max: 0
