schema_version: "1.1"
name: clean-code-format
description: >-
  Changed lines in card.tsx are clean; card.tsx also has pre-existing issues (hardcoded
  aria-labels, an "as number" cast). The report must carry the Attribution SHAs, count 0 introduced
  issues, and either list the old ones as [pre-existing] or declare them not reviewed.
plugins: ["../.."]
runs: 1
tags: [attribution]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Bash]
  prompt: "/frontend-v2-plugin:v2-clean-code --base pr-base app/components/card.tsx"
graders:
  - name: attribution-line
    type: regex
    pattern: 'Attribution:[`* ]*base[`* ]*[0-9a-f]{40}[`* ]*→[`* ]*head[`* ]*[0-9a-f]{40}'
  - name: zero-introduced
    type: regex
    pattern: 'Issues \(0\b'
  - name: preexisting-tagged-or-declared
    type: regex
    pattern: '\[pre-existing\]|not reviewed \(changed ranges only\)'
  - name: no-introduced-finding
    type: regex
    pattern: ':[0-9][0-9, -]*[`*]*\s*\[introduced\]'
    match: not_contains
  - name: report-shown-verbatim
    type: regex
    pattern: 'Clean Code Audit\n=+'
