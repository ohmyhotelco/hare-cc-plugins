schema_version: "1.1"
name: security-touched
description: >-
  gallery.tsx:9 already interpolated the URL into CSS url("...") at base; the change only wraps
  the value in withWidth → [touched]. The change also adds dangerouslySetInnerHTML (line 17) →
  [introduced].
plugins: ["../.."]
runs: 1
tags: [attribution]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, SendMessage, Bash]
  prompt: "/frontend-v2-plugin:v2-security --base pr-base app/components/gallery.tsx"
graders:
  - name: attribution-line
    type: regex
    pattern: 'Attribution:[`* ]*base[`* ]*[0-9a-f]{40}[`* ]*→[`* ]*head[`* ]*[0-9a-f]{40}'
  - name: css-url-is-touched
    type: regex
    pattern: 'gallery\.tsx:[0-9 ,-]*\b(7|8|9)\b[0-9 ,-]*[`*]*\s*\[touched\]'
  - name: css-url-not-introduced
    type: regex
    pattern: 'gallery\.tsx:[0-9 ,-]*\b(7|8|9)\b[0-9 ,-]*[`*]*\s*\[introduced\]'
    match: not_contains
  - name: innerhtml-introduced
    type: regex
    pattern: 'gallery\.tsx:[0-9 ,-]*\b17\b[0-9 ,-]*[`*]*\s*\[introduced\]'
  - name: report-shown-verbatim
    type: regex
    pattern: 'Security Audit Report\n=+'
  - name: agent-tags-new-line-introduced
    type: regex
    target: trace
    pattern: 'gallery\.tsx:17[^\n]{0,6}\[touched\]'
    match: not_contains
